.cr-app {

  --header: 69px;

  --surface: #231632;
  --edge: #79569d;

  --body: 'Sofia Sans', Arial, sans-serif;
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  background: var(--page);
  color: #fff;
  font: 700 15px/1.25 var(--body);
  font-feature-settings: 'ss01' on;
  color-scheme: dark;
}

.cr-app button { color: inherit; cursor: pointer; font: inherit; }
.cr-app button:disabled { color: #a09e99; cursor: default; }
.cr-app button:focus-visible, .cr-app a:focus-visible, .cr-app input:focus-visible, .cr-app select:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.cr-app h1, .cr-app h2, .cr-app p { margin: 0; }
.cr-app img { display: block; }
.cr-app .cr-icon { display: inline-block; width: 1em; height: 1em; vertical-align: -.14em; flex-shrink: 0; }
.cr-backdrop {
  position: fixed;
  inset: var(--header) 0 0 var(--sidebar);

}

.cr-header {

.cr-logo { display: block; flex-shrink: 0; width: 174px; }

.cr-brand > span { color: var(--green); }
.cr-wheel-logo .cr-brand { font-size: 20px; }
.cr-nav {
  position: absolute;
  left: 50%;

  height: 100%;

}
.cr-nav button {

  border: 0;
  background: transparent;

  font: 500 24px/1 var(--display);

}
.cr-nav button:not(:last-child)::after { position: absolute; content: ''; height: 30px; width: 1px; background: #ffffff8c; right: 0; top: calc(50% - 15px); }
.cr-nav button.active, .cr-nav button:hover { color: var(--blue); }
.cr-nav button.active::before {
  content: '';
  position: absolute;

  background: repeating-linear-gradient(0deg, #8edbff10 0 2px, #8edbff30 2px 3px, transparent 3px 4px),
    repeating-linear-gradient(90deg, #85bcda28 0 22px, transparent 22px 24px);
  mask-image: linear-gradient(90deg, transparent, #000 18%, #000 78%, transparent);
}
.cr-account, .cr-wallet { display: flex; align-items: center; gap: 11px; }

  height: 44px;

}
.cr-count, .cr-coins { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.cr-app .cr-count { padding: 0; border: 0; background: none; color: var(--blue); }
.cr-coins { color: var(--green); }
.cr-account .cr-topup { display: grid; place-items: center; height: 44px; width: 44px; border: 1px solid var(--green); background: #104233; color: var(--green); box-shadow: inset 0 0 13px #32c78a55; }
.cr-topup .cr-icon { font-size: 17px; }
.cr-app .cr-bell { position: relative; display: grid; place-items: center; width: 32px; height: 44px; padding: 0; border: 0; background: none; color: var(--blue); font-size: 32px; }

.cr-flag { width: 44px; height: 44px; object-fit: cover; }

.cr-feed { position: fixed; inset: var(--header) auto 0 0; z-index: 4; width: var(--sidebar); display: flex; flex-direction: column; background: linear-gradient(180deg,#251834,#150e20); border-right: 1px solid #72508d70; }
.cr-online { display: flex; align-items: center; justify-content: space-between; height: 52px; flex: 0 0 52px; padding: 0 48px 0 20px; border-bottom: 1px solid #ffffff16; color: #bfb5d6; font-size: 18px; }

.cr-feed-tabs { display: grid; grid-template-columns: 1fr 1fr; height: 52px; flex: 0 0 52px; }

.cr-main { margin-left: var(--sidebar); min-height: calc(100vh - var(--header)); }
.cr-catalog-bar { height: 52px; margin-left: calc(-1 * var(--sidebar)); padding: 0 15px; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(90deg, #241732, #30203e 60%, #21152e); border-bottom: 1px solid #76599262; }
.cr-catalog-bar button { border: 0; background: none; padding: 7px 11px; border-radius: 2px; font-size: 14px; letter-spacing: .015em; text-transform: uppercase; white-space: nowrap; }
.cr-catalog-bar button[aria-pressed='true'] { color: var(--green); background: #51356e; }
.cr-catalog-bar .cr-search-button { font-size: 26px; padding: 0 5px; }
.cr-catalog-bar input, .cr-case-form input, .cr-case-form select { border: 1px solid #ffffff40; padding: 8px 10px; background: #292b2ce0; color: white; font: inherit; }
.cr-catalog { width: min(1360px, calc(100% - 80px)); margin: 0 auto; padding: 65px 0 48px; }
.cr-catalog h1, .cr-heading-link { color: #fff; font: 500 28px/1.1 var(--display); text-transform: uppercase; }

.cr-case-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 15px; }
.cr-case { position: relative; overflow: hidden; text-align: left; background: #211630e8; border: 1px solid #76548f5c; padding: 0; min-width: 0; }

.cr-case-art { display: grid; place-items: center; width: 100%; aspect-ratio: 260 / 186; background: linear-gradient(155deg,#352344,#463454 68%,#291c39); }

.cr-case-info > span { font: 650 17px/1.25 var(--display); }
.cr-case-info .cr-icon { font-size: 14px; }
.cr-new, .cr-level { position: absolute; color: #fff; font-weight: 800; }
.cr-new { top: 0; left: 0; background: #8055c3; padding: 5px; box-shadow: 2px 2px 4px #0005; }
.cr-authors { margin-top: 50px; }
.cr-authors--first { margin-top: 0; }
.cr-section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 20px; }
.cr-app .cr-heading-link { display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 0; background: none; font: 500 28px/1.1 var(--display); }
.cr-author-body { position: relative; width: 100%; padding: 0; border: 0; display: block; background: none; text-align: left; }
.cr-author .cr-case-art { aspect-ratio: 260 / 208; border-bottom: 6px solid var(--amber); }

.cr-avatar, .cr-favorite { position: absolute; top: 10px; width: 30px; height: 30px; }
.cr-avatar { left: 10px; pointer-events: none; }
.cr-app .cr-favorite { display: grid; place-items: center; right: 10px; border: 0; background: #1e212170; color: #a6a6a679; padding: 0; }
.cr-app .cr-favorite[aria-pressed='true'] { color: var(--amber); }
.cr-level { right: 0; top: calc((100% - 73px) - 20px); padding: 2px 10px; background: #a04ec3; font-size: 11px; }
.cr-level.high { background: #5d8f2b; }
.cr-app .cr-more { display: flex; width: 100%; height: 44px; justify-content: center; align-items: center; gap: 10px; background: #231732db; border: 1px solid #76548f65; margin-top: 14px; text-transform: uppercase; font-size: 14px; }
.cr-more .cr-icon { font-size: 21px; }
.cr-more:hover { background: #26211ab0; }

.cr-app .cr-button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 44px; padding: 0 19px; border: 1px solid #79569d; background: #291b38e8; color: #fff; text-transform: uppercase; font-size: 14px; }

.cr-notification > div { padding: 25px 21px 22px; }
.cr-notification h2 { text-align: center; font: 650 22px/1.05 var(--display); text-transform: uppercase; }
.cr-notification h2 .cr-icon { color: var(--green); margin-right: 6px; }
.cr-notification p { margin: 14px 0 0; font-size: 16px; color: #969696; line-height: 1.55; }

.cr-notification footer { display: flex; gap: 10px; padding: 20px; background: #252525; }

.cr-wide { width: min(1520px, calc(100% - 80px)); margin: 0 auto; }
.cr-main--detail { padding-bottom: 78px; background: radial-gradient(#ffffff17 0.65px, transparent 1px) 0 0 / 8px 8px, #3d312630; }

.cr-case-hero { width: min(400px, 62%); height: 185px; object-fit: contain; filter: drop-shadow(0 16px 12px #17151366); }
.cr-case-stage .cr-back, .cr-case-stage .cr-sound { position: absolute; top: 20px; z-index: 2; }
.cr-back { left: 20px; }
.cr-case-stage .cr-sound { width: 44px; padding: 0; right: 20px; font-size: 22px; }
.cr-shortage { position: absolute; width: min(432px, calc(100% - 32px)); text-align: center; border: 1px solid var(--amber); border-radius: 3px; padding: 18px 12px 20px; background: radial-gradient(#ffffff2b .7px, transparent 1px) 0 0 / 4px 4px, #453512e8; }
.cr-shortage > strong { color: var(--amber); font: 650 22px/1 var(--display); text-transform: uppercase; }
.cr-shortage p { margin: 6px 0 20px; font-size: 13px; }
.cr-shortage .cr-button .cr-icon { font-size: 22px; }
.cr-case-detail { padding-top: 30px; }
.cr-case-detail h1 { text-align: center; font: 800 23px/1.2 var(--body); text-transform: uppercase; }
.cr-open-row { display: flex; justify-content: center; gap: 10px; margin: 12px 0 30px; }
.cr-open-row .cr-fast { width: 44px; padding: 0; font-size: 20px; }
.cr-open-row .cr-open { min-width: 239px; }
.cr-open .cr-icon { font-size: 22px; }
.cr-case-contents { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 20px 19.5px; padding-top: 30px; border-top: 1px solid #ffffff55; }
.cr-guaranteed-drop { width: min(100%, 245px); margin: 0 auto 25px; padding: 12px; border: 1px solid #d2ff6490; background: linear-gradient(145deg,#382749,#211732); text-align: center; box-shadow: 0 0 24px #d2ff6420; }
.cr-guaranteed-drop .cr-skin-label { text-align: left; }
.cr-guaranteed-drop > p { padding: 9px 0 2px; color: var(--green); }
.cr-skin { position: relative; min-width: 0; width: 100%; text-align: left; }
.cr-skin-art { position: relative; display: grid; place-items: center; aspect-ratio: 173 / 133; overflow: hidden; border-bottom: 4px solid var(--rarity); background: linear-gradient(#454747, #979797); }
.cr-skin-art img { width: 90%; height: 94%; object-fit: contain; }
.cr-skin-label { padding-top: 6px; line-height: 1.3; }
.cr-skin-label strong, .cr-skin-label span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.cr-skin-label span { color: #c2bdb6; }
.cr-skin-price { position: absolute; top: 5px; right: 6px; font-size: 13px; text-align: right; }
.cr-skin-price small { display: block; }
.cr-skin--compact .cr-skin-label { position: absolute; bottom: 11px; left: 6px; right: 6px; padding: 0; text-shadow: 0 1px 5px #000c; }
.cr-skin--compact .cr-skin-label strong, .cr-skin--compact .cr-skin-label span { font-size: 11px; }
.cr-skin--compact .cr-skin-art { aspect-ratio: 170 / 130; }
.cr-skin--compact .cr-skin-art img { height: 76%; width: 82%; }
.cr-case-stage--reel { background-image: linear-gradient(#20242388, #20242388), url('media/courtyard.webp?v=2'); }
.cr-reel { --step: 164px; position: relative; width: min(100%, 1100px); overflow: hidden; padding: 10px 0 14px; mask-image: linear-gradient(90deg, transparent, black 9%, black 91%, transparent); }
.cr-reel::after { content: ''; position: absolute; top: 0; bottom: 0; left: calc(50% - 1px); width: 2px; background: #ffaf04; box-shadow: 0 0 9px #ffaf04; pointer-events: none; }
.cr-reel-track { position: relative; left: calc(50% - var(--step) / 2 + 4px); display: flex; gap: 8px; width: max-content; transform: translateX(calc(var(--stop) * var(--step) * -1)); transition: transform var(--duration) cubic-bezier(.08,.57,.10,1); }
.cr-reel-track .cr-skin { flex: 0 0 calc(var(--step) - 8px); width: calc(var(--step) - 8px); background: #252525bf; }
.cr-reel-track .cr-skin-label { padding: 5px 7px; }
.cr-drop { margin: 12px auto; text-align: center; }
.cr-drop p { margin-bottom: 10px; color: #d9d4cc; }
.cr-drop strong { color: #fff; }
.cr-drop > div { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

.cr-upgrade { padding-top: 31px; padding-bottom: 55px; }
.cr-upgrade-tools { display: flex; }
.cr-upgrade-tools .cr-button { padding: 0; min-height: 29px; width: 37px; font-size: 17px; color: var(--blue); }
.cr-upgrade-top { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1.35fr); grid-template-rows: minmax(340px, auto) 64px; gap: 20px; }
.cr-selection { position: relative; display: flex; flex-direction: column; min-height: 100%; min-width: 0; background: #25292a62; border-radius: 2px 2px 0 0; }
.cr-selection::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .12; background-image: url("data:image/svg+xml,%3Csvg width='42' height='42' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M21 17v8m-4-4h8' stroke='%23ddd'/%3E%3C/svg%3E"); }
.cr-selection h2 { z-index: 1; display: flex; align-items: center; min-height: 58px; padding: 10px 19px; background: #14191bd1; font-size: 14px; color: #b6b8b9; }
.cr-selection p { flex: 1; display: grid; place-items: center; padding: 16px; text-align: center; font-size: 13px; color: #b9bbba; opacity: .8; }
.cr-selection-items { z-index: 1; flex: 1; display: flex; justify-content: center; align-content: center; align-items: center; flex-wrap: wrap; gap: 12px; padding: 15px; }
.cr-selection-items > button, .cr-selection-items > .cr-skin { width: min(45%, 173px); padding: 0; border: 0; background: none; }
.cr-wheel-column { display: flex; flex-direction: column; justify-content: space-between; align-items: center; gap: 19px; min-width: 0; }
.cr-wheel-logo { width: 100%; height: 57px; display: grid; place-items: center; background: linear-gradient(90deg, #24173200, #362448a0 42%, #24173200); }
.cr-wheel-logo img { width: 151px; }
.cr-wheel {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  max-width: 400px;
  aspect-ratio: 1;
  color: #ffad02;
  container-type: inline-size;
}
.cr-wheel::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: repeating-conic-gradient(#ffffff42 0deg .7deg, transparent .7deg 3deg);
  mask-image: radial-gradient(transparent 64%, black 65%, black 69%, transparent 70%);
}
.cr-wheel-face {
  position: absolute;
  inset: 5.7%;
  display: grid;
  place-items: center;
  border: 10px solid #a0a3a085;
  border-radius: 50%;
  box-shadow: inset 0 0 9px #191919;
  background: linear-gradient(#11131a33 24%, transparent 52%, #4b1100ae),
    conic-gradient(#181a1a 0 var(--arc-start), #bd6d00 var(--arc-start) 180deg, #b26000 180deg var(--arc-end), #101314 var(--arc-end) 360deg);
}
.cr-wheel-center { position: relative; display: grid; place-items: center; width: 71%; aspect-ratio: 1; overflow: hidden; border-radius: 50%; background: #191916; border: 6px solid #b4ae9428; box-shadow: 0 0 17px #d59a003c, inset 0 0 16px #0a0a0a; color: white; text-align: center; }
.cr-wheel-center i { position: absolute; width: 75%; height: 77%; inset: 11.5% 12.5%; background: linear-gradient(130deg, #f68d09, #a54704); mask: url('media/emblem.webp?v=2') center / contain no-repeat; opacity: .85; }
.cr-wheel-center > div { position: relative; text-shadow: 0 2px 5px #251400; }
.cr-wheel-center strong { display: block; font-size: clamp(20px, 9cqw, 36px); line-height: 1.05; }
.cr-wheel-center span { display: block; font-size: clamp(11px, 4cqw, 16px); }
.cr-wheel.success .cr-wheel-center strong { color: #49e89b; }
.cr-wheel.failure .cr-wheel-center strong { color: #ff746d; }
.cr-tick { position: absolute; font-size: clamp(9px, 3.4cqw, 14px); color: #ffffff42; }
.cr-tick--top { top: 4%; }
.cr-tick--bottom { bottom: 5%; }
.cr-tick--left { left: 4%; }
.cr-tick--right { right: 4%; }
.cr-wheel-pointer { position: absolute; inset: 4%; transform: rotate(var(--wheel-turn)); transition: transform var(--wheel-time) cubic-bezier(.13,.69,.11,1); }
.cr-wheel-pointer i { position: absolute; bottom: 2%; left: 50%; transform: translateX(-50%); width: 10%; aspect-ratio: 1; clip-path: polygon(50% 0, 100% 100%, 50% 78%, 0 100%); background: linear-gradient(#ffd32a, #fb7504); filter: drop-shadow(0 0 6px #ffad00); }
.cr-slider { display: flex; gap: 8px; align-items: center; padding: 8px 12px; min-width: 0; background: #312d245e; color: #bab8af; font-size: 14px; }
.cr-slider > .cr-icon { font-size: 29px; color: #fff; }
.cr-slider > span:nth-of-type(1) { white-space: nowrap; }

.cr-app .cr-help { position: fixed; z-index: 5; bottom: 21px; right: 24px; display: grid; place-items: center; width: 55px; height: 55px; padding: 0; border: 0; border-radius: 50%; background: #e88816; color: white; font-size: 34px; }
